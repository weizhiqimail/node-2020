<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form</title>
</head>
<body>
<form action="http://localhost:4200/post" method="POST" enctype="application/x-www-form-urlencoded">
    <input type="hidden" value="xxxx">
    <!--  隐藏域，后端存储，提交后后端进行验证  -->
    <p>username: <input type="text" name="username"></p>
    <p>password: <input type="text" name="password"></p>
    <p>
        <button type="submit">submit</button>
    </p>
</form>

<button id="submit">submit ajax data</button>

<script>

  submit.addEventListener('click', () => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'http://localhost:4200/reg', true);
    xhr.send(JSON.stringify({name: 'jack'}));
    xhr.onload = function () {
      console.log(xhr.response);
    }
  });
</script>


</body>
</html>
